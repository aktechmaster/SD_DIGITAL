<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dashboard Informasi Guru Islam Terpadu Al-Kautsar</title>
    
    <link rel="icon" href="logosmpit.png" type="image/png">
    <style>
    /* Reset dasar */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        /* PERUBAHAN: Latar belakang gradasi krem hangat ke hijau sangat lembut */
        background: linear-gradient(135deg, #fdfbf7 0%, #f4f4e9 50%, #e0e5d6 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }

    /* Elemen dekoratif latar belakang (lingkaran cahaya) */
    .circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.6; /* Opacity dinaikkan sedikit untuk latar terang */
        filter: blur(80px);
        z-index: 0;
    }
    /* PERUBAHAN: Lingkaran kiri atas (Hijau Sage lembut) */
    .c1 { 
        width: 300px; height: 300px; top: 10%; left: 20%; 
        background: linear-gradient(to right, #d4e0c9, #a3b18a);
    }
    /* PERUBAHAN: Lingkaran kanan bawah (Krem/Earth tone) */
    .c2 { 
        width: 250px; height: 250px; bottom: 10%; right: 20%; 
        background: linear-gradient(to right, #faedcd, #e9edc9); 
    }

    /* Wadah Login (Efek Glassmorphism Terang) */
    .login-container {
        /* PERUBAHAN: Efek kaca disesuaikan jadi lebih putih/terang */
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 40px;
        width: 400px;
        text-align: center;
        /* PERUBAHAN: Bayangan diubah ke nuansa hijau gelap transparan */
        box-shadow: 0 15px 35px rgba(88, 129, 87, 0.1);
        z-index: 1;
        /* PERUBAHAN: Warna teks utama diubah menjadi Hijau Tua/Abu Gelap */
        color: #344e41; 
    }

    /* Wadah Logo */
    .-container {
        margin: 0 auto 20px;
        text-align: center;
    }
    
    /* Gaya Gambar Logo */
    .-img {
        width: 80px;
        height: 80px;
        object-fit: contain; 
        /* PERUBAHAN: Drop shadow disesuaikan untuk latar terang */
        filter: drop-shadow(0 5px 10px rgba(88, 129, 87, 0.2)); 
    }

    h2 {
        margin-bottom: 5px;
        font-weight: 600;
        letter-spacing: 1px;
    }
    
    p.subtitle {
        font-size: 0.9em;
        /* PERUBAHAN: Warna subtitle menjadi hijau pucat elegan */
        color: #588157; 
        margin-bottom: 30px;
    }

    /* Input Form */
    .input-group {
        position: relative;
        margin-bottom: 20px;
        text-align: left;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9em;
        /* PERUBAHAN: Warna teks label */
        color: #4a5d4e; 
    }

    .input-group input {
        width: 100%;
        padding: 12px 15px;
        /* PERUBAHAN: Latar belakang input sedikit putih */
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(163, 177, 138, 0.6);
        border-radius: 8px;
        /* PERUBAHAN: Teks input pengguna */
        color: #2b3a30; 
        font-size: 1em;
        outline: none;
        transition: 0.3s;
    }

    .input-group input:focus {
        background: #ffffff;
        /* PERUBAHAN: Efek glowing saat fokus jadi hijau lembut */
        border-color: #588157;
        box-shadow: 0 0 10px rgba(88, 129, 87, 0.2);
    }

    /* Tombol Login */
    .btn-login {
        width: 100%;
        padding: 12px;
        /* PERUBAHAN: Gradasi tombol jadi hijau segar/daun */
        background: linear-gradient(to right, #8a9a5b, #588157);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        /* PERUBAHAN: Bayangan hijau saat di-hover */
        box-shadow: 0 5px 15px rgba(88, 129, 87, 0.3);
    }

    /* Footer kecil */
    .footer {
        margin-top: 20px;
        font-size: 0.8em;
        /* PERUBAHAN: Warna footer lebih tegas dari latar */
        color: rgba(52, 78, 65, 0.7);
    }
    
    /* Pesan Error */
    #error-msg {
        color: #d9534f;
        font-size: 0.9em;
        margin-top: 10px;
        display: none;
    }
</style>
</head>
<body>

    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="login-container">
        <div class="-container">
            <img src="logosit.png" alt="Logo IT" class="logo-img">
        </div>

        <h2>Dashboard Informasi Guru Islam Terpadu Al-Kautsar</h2>
        <p class="subtitle">SDIT Al-Kautsar Mukomuko</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">MASUK PORTAL</button>
            <p id="error-msg">Username atau Password salah!</p>
        </form>

        <div class="footer">
            &copy; 2026 <span>SDIT Al-Kautsar Mukomuko</span> <br> Designed & Developed by aktechmaster
        </div>
    </div>

    <script>
    // =======================================================
    // KONFIGURASI PENTING
    // =======================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZKEYXblP_bpPvojEjemtvw0ozji2pp5wIv6igMSSdqj3ICm11F7BCr6NbqGzzfQxYfw/exec"; 
    
    // Otomatis tanamkan URL ke browser saat halaman dibuka
    localStorage.setItem('gasUrl', SCRIPT_URL);
    localStorage.setItem('gas_url', SCRIPT_URL);

    let databaseGuru = []; 
    const btnLogin = document.querySelector('.btn-login');

    // 1. SAAT HALAMAN DIBUKA, AMBIL DATA TERBARU DARI SHEET
    window.onload = async function() {
        try {
            btnLogin.innerHTML = "Memuat Data...";
            btnLogin.disabled = true;
            btnLogin.style.opacity = "0.7";

            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            if (data.users) {
                databaseGuru = data.users;
                console.log("Data Guru Berhasil Dimuat:", databaseGuru.length, "orang");
                
                btnLogin.innerHTML = "MASUK PORTAL";
                btnLogin.disabled = false;
                btnLogin.style.opacity = "1";
            }

        } catch (error) {
            console.error("Gagal ambil data:", error);
            btnLogin.innerHTML = "Gagal Koneksi Server";
            alert("Gagal mengambil data database! Pastikan internet lancar atau URL Script benar.");
        }
    };

    // 2. LOGIKA LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const inputUser = document.getElementById('username').value.trim();
        const inputPass = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (databaseGuru.length === 0) {
            alert("Data guru belum selesai dimuat. Tunggu sebentar...");
            return;
        }

        const guruDitemukan = databaseGuru.find(g => 
            g.username.toLowerCase() === inputUser.toLowerCase() && 
            String(g.password) === String(inputPass)
        );

        if (guruDitemukan) {
            // =======================================================
            // PERBAIKAN UTAMA: SIMPAN SELURUH DATA GURU & URL KE MEMORI BROWSER
            // =======================================================
            localStorage.setItem('namaGuru', guruDitemukan.nama);
            localStorage.setItem('bio', JSON.stringify(guruDitemukan));
            localStorage.setItem('user', JSON.stringify(guruDitemukan));
            localStorage.setItem('dataGuru', JSON.stringify(guruDitemukan));
            localStorage.setItem('gasUrl', SCRIPT_URL);
            localStorage.setItem('gas_url', SCRIPT_URL);
            
            // Animasi tombol sukses
            btnLogin.innerHTML = "Berhasil Masuk...";
            btnLogin.style.background = "linear-gradient(to right, #11998e, #38ef7d)";
            
            // Redirect setelah 1 detik
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);

        } else {
            // GAGAL
            errorMsg.style.display = 'block';
            document.querySelector('.login-container').style.animation = "shake 0.5s";
            setTimeout(() => { document.querySelector('.login-container').style.animation = "none"; }, 500);
        }
    });
</script>

</body>

</html>
